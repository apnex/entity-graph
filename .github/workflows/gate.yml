# The gate (docs/DECISIONS.md D10; entity-store's and shape-check's, taken under draw's H31-10): the repository's own tests --
# the contract suite, the Exactness property, the mutation checks and the vocabulary check among them -- and its docs check on
# every push and pull request, on Node 22 and Node 24, then the consumer test on Node 22: the package packed, installed into an
# empty project with --omit=dev, every export imported by name, and the corpus it ships run against it. A release is made by
# release.yml alone, on a protected v* tag (docs/DECISIONS.md D44).
name: gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # a backstop: a hang fails the job rather than holding a runner for hours
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run docs:check

  consumer:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: the consumer test
        run: node tools/consumer-test.mjs
